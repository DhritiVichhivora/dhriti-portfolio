<!doctype html>
<html lang="en" data-mood="burgundy">
<head>

  <meta property="og:type" content="website">
  <meta property="og:title" content="Dhriti Vichhivora | Data Science, AI, Curiosity">

  <meta property="og:image" content="https://dhritivichhivora.github.io/dhriti-portfolio/assets/photo.jpg">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%236B263B'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='28' font-weight='700' text-anchor='middle' fill='%23F7F0EB'%3EDV%3C/text%3E%3C/svg%3E">

  <!-- Two web fonts only: Playfair Display (variable weight) and Space Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Space+Grotesk:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">

  <!-- Apply the saved colour mood before the first paint, so there is no flash -->
  <script>
    (function () {
      try {
        var m = localStorage.getItem('dv-mood');
        if (m === 'midnight' || m === 'blush') document.documentElement.setAttribute('data-mood', m);
      } catch (e) {}
      document.documentElement.className += ' js';
    })();
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <!-- Entry curtain: shown for a moment, then slides away -->
  <div class="curtain" id="curtain" aria-hidden="true"><span>DV</span></div>

  <!-- Top navigation -->
  <header class="nav" id="nav">
    <div class="wrap nav-in">
      <a class="mono" href="#top" aria-label="Dhriti Vichhivora, back to the cover">DV</a>
      <div class="nav-right">
        <span class="label nav-portfolio" aria-hidden="true">Portfolio</span>
        <nav aria-label="Main">
          <ul class="nav-links" id="nav-links"></ul>
        </nav>
        <button class="mood-btn" id="mood-btn" type="button" aria-label="Change colour mood">
          <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
            <path d="M16 16 L16 2 A14 14 0 0 1 28.12 23 Z" class="sw sw-1"/>
            <path d="M16 16 L28.12 23 A14 14 0 0 1 3.88 23 Z" class="sw sw-2"/>
            <path d="M16 16 L3.88 23 A14 14 0 0 1 16 2 Z" class="sw sw-3"/>
            <circle cx="16" cy="16" r="14" class="sw-ring"/>
          </svg>
        </button>
        <button class="burger" id="burger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="menu">
          <span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <!-- Full-screen mobile menu -->
  <div class="menu" id="menu" inert>
    <nav aria-label="Mobile">
      <ol class="menu-links" id="menu-links"></ol>
    </nav>
  </div>

  <main id="main" tabindex="-1">
    <!-- Plain fallback: shown only if the JavaScript cannot build the page -->
    <div class="fallback" id="fallback">
      <h1>Dhriti Vichhivora</h1>
      <p>Data Science student, NMIMS Mumbai. Figuring it out. Building it anyway.</p>
      <p>
        <a href="mailto:dhriti076@gmail.com">dhriti076@gmail.com</a> ·
        <a href="https://www.linkedin.com/in/dhriti-vichhivora-3155a9373">LinkedIn</a> ·
        <a href="https://github.com/DhritiVichhivora">GitHub</a>
      </p>
      <noscript><p>This portfolio is built with JavaScript. Turn it on to see the full magazine, or use the links above.</p></noscript>
    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <!-- The player bar: scrolling the page is "playing" the track -->
  <div class="player" id="player" role="region" aria-label="Page player">
    <div class="pl-art" aria-hidden="true">
      <span class="vinyl amb"></span>
      <img id="pl-img" src="assets/photo-small.jpg" width="40" height="40" alt="">
      <span class="pl-mono">DV</span>
    </div>
    <div class="pl-meta">
      <span class="pl-list" id="pl-list">Portfolio 2026</span>
      <span class="pl-title" id="pl-title"><span class="pl-t">Cover</span></span>
    </div>
    <div class="pl-prog">
      <span class="pl-time" id="pl-now">0:00</span>
      <div class="pl-track" id="pl-track" role="slider" tabindex="0" aria-label="Page progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0:00 of 2:30">
        <span class="pl-fill" id="pl-fill"></span>
      </div>
      <span class="pl-time" id="pl-total">2:30</span>
    </div>
    <div class="pl-ctrl">
      <button class="pl-btn pl-prev" id="pl-prev" type="button" aria-label="Previous section">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
      </button>
      <button class="pl-btn pl-play" id="pl-play" type="button" aria-label="Ambient animation" aria-pressed="true">
        <svg class="i-pause" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
        <svg class="i-play" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="pl-btn pl-next" id="pl-next" type="button" aria-label="Next section">
        <svg class="i-next" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
        <svg class="i-replay" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
      </button>
    </div>
  </div>

  <!-- Small status messages ("Copied", "Mood: Midnight") -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- GSAP + ScrollTrigger (optional extras; the site works without them) -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" integrity="sha384-g4NTh/Iv5PPU4xPyhEWqPcwtNXOvdaDI8LLnyYfyNZOjKJeYQyjzQ9X5275eBjpt" crossorigin="anonymous"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" integrity="sha384-Z3REaz79l2IaAZqJsSABtTbhjgOUYyV3p90XNnAPCSHg3EMTz1fouunq9WZRtj3d" crossorigin="anonymous"></script>
  <script defer src="js/data.js"></script>
  <script defer src="js/main.js"></script>
</body>
</html>
